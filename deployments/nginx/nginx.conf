server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # single-spa entry bundle: stable, unhashed filename (vite entryFileNames:
  # 'main.js'). The root/shell loads this on every page load, so it must always
  # be revalidated — otherwise a new deployment is never picked up.
  # Exact-match location takes priority over the regex block below.
  location = /main.js {
    add_header 'Cache-Control' 'no-cache, no-store, must-revalidate';
    add_header 'Pragma' 'no-cache';
    add_header 'Expires' '0';
    add_header 'Access-Control-Allow-Origin' '*';
  }

  # Content-hashed build assets (fonts/images, and any future hashed JS/CSS
  # chunks): the hash changes when content changes, so cache them forever.
  location ~* ^/.*(jpg|jpeg|png|gif|ico|css|js|ttf|woff|woff2)$ {
    rewrite ^/(/.*)$ $1 break;
    add_header 'Cache-Control' 'public, max-age=31536000, immutable';
    # Re-declare inherited headers: nginx drops parent add_header once a block
    # defines any add_header of its own.
    add_header 'Access-Control-Allow-Origin' '*';
  }

  add_header 'Access-Control-Allow-Origin' '*';
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # No HTML entry point is served in the microfrontend flow, but keep any
    # fallback response uncacheable to be safe.
    add_header 'Cache-Control' 'no-cache, no-store, must-revalidate';
    add_header 'Pragma' 'no-cache';
    add_header 'Expires' '0';
    add_header 'Access-Control-Allow-Origin' '*';

    #  if ($request_method = 'OPTIONS') {
    #   add_header 'Access-Control-Max-Age' 1728000;
    #   add_header 'Access-Control-Allow-Origin' '*';
    #   add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,
    #   X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range';
    #   add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE,PATCH';
    #   add_header 'Content-Type' 'application/json';
    #   add_header 'Content-Length' 0;
    #   return 204;
    # }

  }
}
