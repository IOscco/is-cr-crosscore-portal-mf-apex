name: Build and Deploy Cloud Run

on:
  push:
    branches:
      - main
      - test/release-*
      - dev
      - integrator

    paths-ignore:
      - '**/*.md'
      
jobs:
  build:
    if: (github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'integrator' || startsWith(github.ref_name, 'test/release-'))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref_name, 'test/release-') && 'test' || github.ref_name }}_ci

    steps:
    - name: 'Checkout Code'
      uses: actions/checkout@v4

    - name: 'Setup Node 20 LTS'
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: 'Configure build secrets'
      run: |
        echo '${{ secrets.BUILD_SECRET }}' > .env

    - name: 'Build project'
      run: |
        npm install
        npm run build

    - name: 'Build project - Upload artifact'
      uses: actions/upload-artifact@v4
      with:
        name: artifact
        path: |
          dist
          package.json
          package-lock.json

  artifact:
    needs: build
    if: (github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'integrator' || startsWith(github.ref_name, 'test/release-'))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref_name, 'test/release-') && 'test' || github.ref_name }}_ci

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      WIF_PROVIDER: WIF_PROVIDER_IS_${{ (startsWith(github.ref_name, 'test/release-') || github.ref_name == 'integrator') && 'test' || github.ref_name }}_TECH
      WIF_SERVICE_ACCOUNT: WIF_SERVICE_ACCOUNT_IS_${{ (startsWith(github.ref_name, 'test/release-') || github.ref_name == 'integrator') && 'test' || github.ref_name }}_TECH

    steps:
    - name: 'Checkout Code'
      uses: actions/checkout@v4

    - name: 'Build project - Download artifact'
      uses: actions/download-artifact@v4
      with:
        name: artifact

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: '${{ secrets[env.WIF_PROVIDER] }}'
        service_account: '${{ secrets[env.WIF_SERVICE_ACCOUNT] }}'

    - name: 'Set up Docker Buildx'
      uses: 'docker/setup-buildx-action@v3'

    - name: 'Login to GCR'
      uses: 'docker/login-action@v3'
      with:
        registry: '${{ vars.GCP_REGION }}-docker.pkg.dev'
        username: oauth2accesstoken
        password: '${{ steps.auth.outputs.access_token }}'

    - name: 'Docker Build and Push'
      uses: 'docker/build-push-action@v5'
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: '${{ vars.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ secrets.GCP_ARTIFACT_REPOSITORY }}/${{ github.event.repository.name }}:${{ github.sha }}'

  deploy:
    runs-on: ubuntu-latest
    needs: artifact
    if: (github.ref_name == 'main' || github.ref_name == 'dev' || startsWith(github.ref_name, 'test/release-'))
    environment: ${{ startsWith(github.ref_name, 'test/release-') && 'test' || github.ref_name }}_cd
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      WIF_PROVIDER: WIF_PROVIDER_IS_${{ startsWith(github.ref_name, 'test/release-') && 'test' || github.ref_name }}_TECH
      WIF_SERVICE_ACCOUNT: WIF_SERVICE_ACCOUNT_IS_${{ startsWith(github.ref_name, 'test/release-') && 'test' || github.ref_name }}_TECH

    steps:
    - name: 'Checkout Code'
      uses: actions/checkout@v4

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: '${{ secrets[env.WIF_PROVIDER] }}'
        service_account: '${{ secrets[env.WIF_SERVICE_ACCOUNT] }}'

    - id: 'deploy'
      name: 'Deploy Cloud Run'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        image: '${{ vars.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ secrets.GCP_ARTIFACT_REPOSITORY }}/${{ github.event.repository.name }}:${{ github.sha }}'
        service: '${{ github.event.repository.name }}'
        region: '${{ vars.GCP_REGION }}'
        revision_traffic: "LATEST=100"

    - name: 'Cloud Run URL'
      run: 'echo "${{ steps.deploy.outputs.url }}"'
